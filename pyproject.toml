[tool.poetry]
name = "agent-ecs"
version = "0.0.0"
description = ""
authors = [
    "Contributors <contributors@example.com>"
]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python=">=3.11,<3.14"
geopy = "2.4.1"
langchain = "1.2.17"
langchain_core = "1.3.3"
langchain_gigachat = "0.5.1"
langgraph = "1.1.10"
langchain-openai = "*"
numpy = "2.4.4"
openpyxl = "3.1.5"
pandas = "3.0.2"
pydantic = "2.13.4"
pytest = "9.0.3"
python-dotenv = "1.2.2"
SQLAlchemy = "2.0.49"
streamlit = "1.57.0"
tabulate = "0.10.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
langgraph-cli = {extras = ["inmem"], version = "^0.4.25"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
line_length = 120
lines_after_imports = 2
lines_between_sections = 1
lines_between_types = 0
force_alphabetical_sort_within_sections = true
ensure_newline_before_comments = true
combine_as_imports = true
combine_star = true
skip_gitignore = true
balanced_wrapping = true
force_grid_wrap = 2
src_paths = ["src"]
skip_glob = [
    ".git",
    ".venv",
    ".vscode",
    "venv",
    "env",
    ".env",
    "alembic/*",
    "docs/*",
]
known_first_party = ["src"]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

[tool.pytest.ini_options]
addopts = "--rootdir=."
pythonpath = ["src"]


[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "^from",
    "^import",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage/html_report"

[tool.coverage.xml]
output = "coverage/report.xml"

[tool.ruff]
line-length = 120
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN204"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]